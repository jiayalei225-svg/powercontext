services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    container_name: stepfun-seekdb
    ports:
      - "2881:2881"
    environment:
      CPU_COUNT: "4"
      MEMORY_LIMIT: "4G"
      DATAFILE_SIZE: "2G"
      LOG_DISK_SIZE: "2G"
    volumes:
      - ./seekdb-data:/var/lib/oceanbase
    restart: unless-stopped
